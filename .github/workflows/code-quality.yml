# This workflow will run lint tools and unit tests
name: Code Quality

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  quality:
    name: Run Code Quality Checks and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'

      - name: Install Tools
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright Browsers
        run: |
          for attempt in 1 2 3; do
            echo "Playwright install attempt ${attempt}/3"
            if timeout 10m npx playwright install chromium; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Playwright install attempt ${attempt} failed or timed out; retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "Playwright browser installation failed after 3 attempts." >&2
          exit 1

      - name: Copy Dependencies
        run: npm run copy-deps
  
      - name: Lint JavaScript
        if: ${{ ! cancelled() }}
        run: npm run eslint
  
      - name: Lint HTML
        if: ${{ ! cancelled() }}
        run: npm run htmllint
  
      - name: Lint CSS
        if: ${{ ! cancelled() }}
        run: npm run csslint

      - name: Spell Check
        if: ${{ ! cancelled() }}
        run: npm run spellcheck

      - name: Type Check
        if: ${{ ! cancelled() }}
        run: npm run typecheck

      - name: Run Unit Tests with Coverage
        if: ${{ ! cancelled() }}
        run: npm run test:coverage

      - name: Upload Coverage Report
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
        
