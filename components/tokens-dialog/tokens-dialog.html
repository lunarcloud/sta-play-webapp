
<!DOCTYPE html>
<html>
    <body>
        <dialog>
            <style>
                dialog[is=tokens-dialog] {
                    width: fit-content;
                    max-width: max(90%, 600px);
                    min-width: 320px;

                    main {
                        display: flex;
                        flex-direction: column;
                        gap: 1em;
                        padding: 1em;
                        max-height: 60vh;
                        overflow-y: auto;
                    }

                    footer {
                        display: flex;
                        flex-direction: row;
                        justify-content: center;
                        gap: 1em;

                        & > button {
                            margin: 0 !important;
                        }

                        & > button.confirm:disabled {
                            filter: grayscale(1) brightness(0.7);
                            cursor: not-allowed;
                        }
                    }

                    .token-list {
                        display: flex;
                        flex-wrap: wrap;
                        gap: 0.75em;
                        min-height: 5em;
                    }

                    .token-card {
                        position: relative;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        gap: 0.25em;
                        width: 5em;
                        padding: 0.5em;
                        border: 2px solid var(--secondary-color-bg);
                        border-radius: 4px;
                        background-color: var(--secondary-color-bg);
                        color: var(--main-color-text);
                        cursor: pointer;

                        &:hover {
                            filter: brightness(1.3);
                        }

                        &.selected {
                            border-color: var(--trek-color-2);
                            filter: brightness(1.3);
                        }
                    }

                    .token-thumb {
                        width: 3.5em;
                        height: 3.5em;
                        object-fit: contain;
                        background-color: var(--main-color-bg);
                        border-radius: 4px;
                    }

                    .token-qty {
                        position: absolute;
                        top: 0.1em;
                        left: 0.1em;
                        padding: 0 0.3em;
                        border-radius: 1em;
                        background-color: var(--trek-color-2);
                        color: var(--nav-color-text);
                        font-size: 0.75em;
                        font-weight: bold;
                        line-height: 1.4;
                    }

                    .token-qty-dec {
                        position: absolute;
                        bottom: 0.1em;
                        left: 0.1em;
                        width: 1.25em;
                        height: 1.25em;
                        padding: 0;
                        border: 1px solid var(--main-color-bg);
                        border-radius: 50%;
                        background-color: var(--trek-color-2);
                        color: var(--nav-color-text);
                        line-height: 1;
                        cursor: pointer;

                        &:hover {
                            filter: brightness(1.2);
                        }

                        &:active {
                            filter: brightness(0.8);
                        }
                    }

                    .token-name {
                        max-width: 100%;
                        overflow: hidden;
                        color: var(--main-color-text);
                        font-size: 0.85em;
                        text-align: center;
                        text-overflow: ellipsis;
                        white-space: nowrap;
                    }

                    .token-remove {
                        position: absolute;
                        top: 0.1em;
                        right: 0.1em;
                        width: 1.25em;
                        height: 1.25em;
                        padding: 0;
                        border: 1px solid var(--main-color-bg);
                        border-radius: 50%;
                        background-color: var(--trek-color-1);
                        color: var(--main-color-text);
                        line-height: 1;
                        cursor: pointer;

                        &:hover {
                            filter: brightness(1.2);
                        }

                        &:active {
                            filter: brightness(0.8);
                        }
                    }

                    .add-token-btn {
                        justify-content: center;
                        min-height: 4.25em;
                        appearance: none;
                        border-style: dashed;
                        border-color: var(--trek-color-2);
                        background-color: transparent;
                        color: var(--trek-color-2);
                        font-family: inherit;
                        font-size: 1.1em;
                        font-weight: bold;

                        &:hover {
                            filter: brightness(1.3);
                        }
                    }
                }
            </style>
            <header>
                Tokens
                <button class="close" role="button">⤫</button>
            </header>
            <main>
                <div class="token-list">
                    <button class="add-token-btn token-card" role="button">＋<br>Add Token</button>
                </div>
                <input class="add-token-input" type="file" accept="image/*" hidden>
            </main>
            <footer>
                <button class="place-tokens-btn confirm" role="button" disabled>Place</button>
                <button class="close" role="button">Close</button>
            </footer>
        </dialog>
    </body>
</html>
