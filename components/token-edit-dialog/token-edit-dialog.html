<!DOCTYPE html>
<html>
    <body>
        <dialog>
            <style>
                dialog[is=token-edit-dialog] {
                    width: fit-content;
                    max-width: max(90%, 360px);
                    min-width: 280px;

                    main {
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        gap: 1em;
                        padding: 1.5em 1em;
                    }

                    .token-preview {
                        width: 5em;
                        height: 5em;
                        object-fit: contain;
                        filter: drop-shadow(3px 3px 5px oklab(57.95% 0 0 / 40%));
                    }

                    .scale-row {
                        display: flex;
                        align-items: center;
                        gap: 0.75em;
                        width: 100%;
                    }

                    .scale-number {
                        display: flex;
                        align-items: center;
                        gap: 0.25em;
                        min-width: 4.5em;

                        & input {
                            width: 3.5em;
                            text-align: end;
                            font-variant-numeric: tabular-nums;
                        }
                    }

                    .order-row {
                        display: flex;
                        align-items: center;
                        gap: 0.75em;
                        width: 100%;

                        & button {
                            flex: 1;
                            padding: 0.4em 0.75em;
                            cursor: pointer;
                        }
                    }

                    footer {
                        display: flex;
                        flex-direction: row;
                        justify-content: center;
                        gap: 1em;

                        & > button {
                            margin: 0 !important;
                        }

                        & > button.remove {
                            appearance: none;
                            background-color: var(--danger-color);
                            color: white;
                            border: none;
                            border-radius: 8px;
                            padding: 2px 20px;
                            cursor: pointer;

                            &:hover {
                                filter: hue-rotate(-10deg);
                            }

                            &:active {
                                filter: brightness(0.8);
                            }
                        }
                    }
                }
            </style>
            <header>
                Edit Token
                <button class="close" role="button">⤫</button>
            </header>
            <main>
                <!-- linthtml-disable img-req-src -->
                <img class="token-preview" src="" alt="token preview">
                <!-- linthtml-enable img-req-src -->
                <div class="scale-row">
                    <label for="token-scale-input">Scale</label>
                    <input id="token-scale-input" type="range" min="0.5" max="2.5" step="0.05" value="1">
                    <span class="scale-number">
                        <input id="token-scale-number" type="number" min="25" step="5" value="100" aria-label="Scale percentage">
                        <span>%</span>
                    </span>
                </div>
                <div class="order-row">
                    <span>Layer order</span>
                    <button type="button" class="send-backward" aria-label="Send backward, behind the previous token">⬇ Back</button>
                    <button type="button" class="bring-forward" aria-label="Bring forward, in front of the next token">⬆ Front</button>
                </div>
            </main>
            <footer>
                <button class="remove" role="button">Remove</button>
                <button class="confirm" role="button">Done</button>
            </footer>
        </dialog>
    </body>
</html>
