<!DOCTYPE html>
<html lang="en">

    <head>
        <title>S.T.A. Play App</title>

        <meta charset="utf-8">
        <meta name="viewport" content="width=800, initial-scale=1, maximum-scale=10.0, minimum-scale=0.25, user-scalable=yes"/>
        <meta name="theme-color" content="black">

        <meta property="og:title" content="Star Trek Adventures: Play App">
        <meta property="og:description" content="Player-Facing Screen for GM's running the Star Trek Adventures TTRPG">
        <meta property="og:image" content="https://lunarcloud.github.io/img/icon.webp" />

        <link rel="manifest" href="./sta-play-webapp.webmanifest">
        <link rel="icon" type="image/x-icon" href="img/icon.webp">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-emoji@5/index.min.css">
        <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" id="theme-link">
        <script src="js/lib/custom-elements.js"></script> <!-- Safari polyfill -->
    </head>

    <body>

        <menu-items>
            <div id="game-name">
                Star Trek
                <br>
                Adventures
                <div class="edition-1">1E</div>
                <div class="edition-2">2E</div>
                <div class="edition-captains-log">Captain's Log</div>
            </div>

            <!-- General Buttons -->
            <a id="settings-btn" class="text-n-symbol-btn" title="edit settings">
                <text>Menu</text>
                <symbol>☰</symbol>
            </a>

            <a id="save-btn" class="text-n-symbol-btn" title="save game">
                <text>Save</text>
                <symbol>💾</symbol>
            </a>

            <a id="dice-btn" class="text-n-symbol-btn" title="dice roller">
                <text>Roll</text>
                <img class="symbol" alt="roll d20 dice" src="img/d20-icon.svg">
            </a>

            <a id="map-btn" class="text-n-symbol-btn" title="map mode">
                <text>Map</text>
                <symbol>🗺️</symbol>
            </a>

            <a id="tables-btn" class="text-n-symbol-btn" title="random tables">
                <text>Tables</text>
                <symbol>📋</symbol>
            </a>

            <a id="fullscreen-btn" class="text-n-symbol-btn" title="Toggle Fullscreen">
                <img class="symbol enter" alt="enter fullscreen" src="img/fullscreen-icon.svg">
                <img class="symbol exit" hidden alt="return from fullscreen" src="img/fullscreen-return-icon.svg">
            </a>

            <a id="font-up-btn" class="text-n-symbol-btn" title="increase font size">
                <text>font</text>
                <symbol>++</symbol>
            </a>

            <a id="font-down-btn" class="text-n-symbol-btn" title="decrease font size">
                <text>font</text>
                <symbol>--</symbol>
            </a>

            <div id="momentum-section">
                <label>
                    Momentum <span class="edition-1 edition-2 pool-text">Pool</span>
                    <input class="edition-captains-log" id="momentum-toggle" type="checkbox">
                </label>
                <input id="momentum-pool" class="edition-1 edition-2" type="number" step="1" min="0" max="6" value="0">
            </div>

            <div id="threat-section">
                <label>
                    Threat <span class="edition-1 edition-2 pool-text">Pool</span>
                    <input class="edition-captains-log" id="threat-toggle" type="checkbox">
                </label>
                <input id="threat-pool" class="edition-1 edition-2" type="number" step="1" min="0" value="2">
            </div>
        </menu-items>
        <!-- Content -->
        <header>
            <!-- linthtml-disable attr-name-style -->
            <model-viewer id="ship-sideways" src=""
                alt="starship 3d model" loading="lazy"
                interaction-prompt="none"
                camera-controls
                camera-orbit="-45deg 95deg 0%"
                field-of-view="25deg"
                min-field-of-view="1deg"
                max-field-of-view="180deg"
                shadow-intensity="0"
                exposure="1"
                zoom-sensitivity="1"
                powerPreference="low-power"
                shadow-softness="1"
                style="margin: 0 auto; min-width: 1px; height: 100%">
                <!-- Unused:
                    auto-rotate auto-rotate-delay="0"
                    orientation="15deg 0deg 45deg"
                    auto-rotate auto-rotate-delay="0" rotation-per-second="1deg"
                -->
            </model-viewer>
            <model-viewer id="ship-top" src=""
                alt="starship 3d model" loading="lazy"
                interaction-prompt="none"
                camera-controls
                camera-orbit="190deg 60deg 0%"
                field-of-view="35deg"
                min-field-of-view="1deg"
                max-field-of-view="180deg"
                shadow-intensity="0"
                exposure="1"
                zoom-sensitivity="1"
                powerPreference="low-power"
                shadow-softness="1"
                style="margin: 0 auto; min-width: 1px; height: 100%">
            </model-viewer>
            <!-- linthtml-enable attr-name-style -->
            <button id="ship-enter-fullscreen" class="fullscreen-btn">
                <img alt="enter fullscreen ship view" src="img/fullscreen-icon.svg">
            </button>
        </header>
        <nav>
            <ul>
                <li title="Add a new player character">
                    <a id="player-add">
                        ＋
                        <span class="edition-1 edition-2"> Player</span>
                        <span class="edition-captains-log"> Character</span>
                    </a>
                </li>
                <li class="edition-1 edition-2" title="Add a combat or extended task tracker">
                    <a id="task-tracker-add">＋ Tracker</a>
                </li>
                <li class="edition-1 edition-2" title="Add a scene trait">
                    <a id="trait-add">＋ Trait</a>
                </li>
                <li id="nav-condition-select" title="Alerts and Conditions">
                    <select id="alert-dropdown">
                        <option value="" selected>None</option>
                        <option value="yellow">Yellow Alert</option>
                        <option value="red">Red Alert</option>
                        <option value="blue">Blue Alert</option>
                        <option value="grey">Grey Mode</option>
                        <option value="black">Black Alert</option>
                        <option value="cloak">Cloak</option>
                    </select>
                    <a class="nav-alt-font-shrink">
                        <emoji>⟁</emoji><text> Condition</text>
                    </a>
                </li>
                <li>
                    <a id="scenes-btn" title="Scene Management">
                        <emoji>⧎</emoji><text> Scenes</text>
                    </a>
                </li>
                <li id="stardate-item">
                    <a id="stardate-btn" title="Stardate"  class="nav-alt-font-shrink">
                        <emoji>📅</emoji><text> —</text>
                    </a>
                </li>
                <li id="shipname" class="shipname" contenteditable="true" autocomplete="off" autocorrect="off" spellcheck="false">USS Winnipesaukee</li>
            </ul>
        </nav>
        <main>
            <content>
                <mission-tracker class="edition-captains-log"></mission-tracker>
                <traits class="edition-1 edition-2"><span>TRAITS: </span></traits>
                <ship-alert></ship-alert>
                <task-trackers></task-trackers>
                <div id="general-text" class="mode-text-only" contenteditable="true">
                    <h1>Story Notes</h1>
                    <p>The story so far...</p>
                </div>
                <div id="play-field" class="mode-map-only">
                    <!-- linthtml-disable attr-bans, attr-name-style, indent-style -->
                    <svg class="bg" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <pattern id="holodeck-grid" patternUnits="userSpaceOnUse" width="56" height="56">
                                <rect fill="transparent" width="56" height="56"/>
                                <line x1="0" y1="0" x2="0" y2="56" stroke="#E5D908" stroke-width="2"/>
                                <line x1="0" y1="0" x2="56" y2="0" stroke="#E5D908" stroke-width="2"/>
                            </pattern>
                        </defs>
                        <rect fill="url(#holodeck-grid)" width="100%" height="100%"/>
                    </svg>
                    <!-- linthtml-enable attr-bans, attr-name-style, indent-style -->
                    <img src="img/transparent-4x3.png" alt="blank scene background" class="bg">
                    <a class="image-change">
                        <input class="select" type="file" accept="image/*" hidden />
                        <emoji>📂</emoji>
                    </a>
                    <a class="image-clear">
                        <emoji>⌫</emoji>
                    </a>
                    <a class="tokens-list-btn" title="tokens">
                        <emoji>🧩</emoji>
                    </a>
                    <span id="npc-tokens"></span>
                    <span id="player-tokens"></span>
                </div>
            </content>
            <select-only class="mode-text-only">Players: </select-only>
            <ul id="text-mode-players" class="players mode-text-only"></ul>
        </main>

        <theme></theme>

        <!-- Dialogs -->
        <dialogs>
            <dialog is="welcome-dialog"></dialog>
            <dialog is="settings-dialog"></dialog>
            <dialog is="dice-dialog"></dialog>
            <dialog is="roll-tables-dialog"></dialog>
            <dialog is="tokens-dialog"></dialog>
            <dialog is="token-edit-dialog"></dialog>
            <dialog is="busy-dialog"></dialog>
            <dialog is="message-dialog"></dialog>
            <dialog is="confirm-dialog"></dialog>
            <dialog is="input-dialog"></dialog>
            <dialog is="scene-switcher"></dialog>
            <dialog is="stardate-dialog"></dialog>
        </dialogs>

        <div id="fullscreen-ship">
            <!-- linthtml-disable attr-name-style -->
            <model-viewer id="ship-fullscreen" src=""
                    alt="starship 3d model" loading="lazy"
                    skybox-image="img/model-viewer/HDR_rich_blue_nebulae_1.jpg"
                    environment-image="img/model-viewer/HDR_rich_blue_nebulae_1.bright.jpg"
                    interaction-prompt="none"
                    camera-controls
                    auto-rotate-delay="400"
                    camera-orbit="180deg 40deg 200m"
                    field-of-view="70deg"
                    min-field-of-view="1deg"
                    max-field-of-view="170deg"
                    shadow-intensity="0"
                    exposure="1"
                    zoom-sensitivity="0.5"
                    shadow-softness="1"
                    style="margin: 0 auto; min-width: 1px; height: 100%">
            </model-viewer>
            <!-- linthtml-enable attr-name-style -->
            <button id="ship-leave-fullscreen" class="fullscreen-btn">
                <img alt="return from fullscreen" src="img/fullscreen-return-icon.svg">
            </button>
            <button id="ship-autorotate-fullscreen">
                <img alt="autorotate the fullscreen ship model" src="img/rotate-icon.svg">
            </button>
            <button id="ship-switch-fullscreen" style="display: none;">
                <span class="chevron-right">›</span>
                <span class="chevron-left" hidden>‹</span>
            </button>
        </div>

        <script type="module" src="index.js" crossorigin="anonymous"></script>
    </body>
</html>
